[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "fastapi>=0.115.0",
    "firecrawl>=4.18.1",
    "logfire>=4.15.1",
    "loguru>=0.7.3",
    # Floor is what narration streaming actually needs and was verified against:
    # Agent.run(event_stream_handler=...), PartEndEvent, and RunContext.tool_call_id.
    "pydantic-ai>=1.56.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.28.3",
    "uvicorn[standard]>=0.34.0",
]

[tool.pytest.ini_options]
# Tests import backend modules by top-level package (`agent`, `api`, `game`). Without this,
# only a whole-directory run works — `pytest tests/test_x.py` fails to import them.
pythonpath = ["."]
testpaths = ["tests"]
